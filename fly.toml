# fly.toml app configuration file generated for pieeg-bot on 2026-07-22T16:46:43-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pieeg-bot'
primary_region = 'lhr'

[build]
[env]
  PIEEG_CHAT_MODEL = 'claude-haiku-4-5'
  PIEEG_EMBED_MODEL = 'BAAI/bge-small-en-v1.5'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
