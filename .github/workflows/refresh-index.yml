name: Refresh documentation index

# The docs index is rebuilt from the live docs on every image build (see the
# Dockerfile), so "refreshing" the index just means deploying. This job triggers
# a nightly deploy; Fly's remote builder re-ingests the latest docs each time.
# One step, one failure mode — no git commits, no push permissions, no state.
on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -L https://fly.io/install.sh | sh
          "$HOME/.fly/bin/flyctl" deploy --remote-only

