[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pieeg-bot"
version = "0.1.0"
description = "Discord companion bot for PiEEG: a documentation RAG over the PiEEG docs and website."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC BY-NC 4.0"}
authors = [
    {name = "PiEEG Community"},
]
keywords = ["eeg", "bci", "pieeg", "discord", "bot", "rag", "documentation", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: CC BY-NC 4.0",
    "Environment :: Console",
]
dependencies = [
    "discord.py>=2.3",
    "numpy>=1.24",
    "anthropic>=0.40",
    "fastembed>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
pieeg-bot = "pieeg_bot.__main__:main"

[project.urls]
Homepage = "https://github.com/pieeg-club/PiEEG-bot"
Repository = "https://github.com/pieeg-club/PiEEG-bot"
Issues = "https://github.com/pieeg-club/PiEEG-bot/issues"

[tool.setuptools.packages.find]
include = ["pieeg_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
